<!DOCTYPE html>
<html lang="en">

<head>
   
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS</title>
    <link rel="icon" type="image/png" href="/batman-icon-png-12040.png">

   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&display=swap" rel="stylesheet">
</head>

<body
    style="background-image: url('/oss.jpg'); margin:0; background-size: cover; background-repeat: no-repeat; background-attachment: fixed;">

    
    <div id="window" class="window">
        <div id="welcomeopen" class="welcometab"></div>
        <img src="/batman-icon-png-12040.png" id="windowclose" class="closebutton" />
        <h1 style="font-family:impact; margin: 4px;">BatOS</h1>
        <p id="welcometext" style="margin: 4px;font-family: Helvetica;">This is <i>Batman</i> OS for the fans of Batman!
        </p>
    </div>

    
    <div class="window" id="casefiles" style="display: none;">

        
        <div class="windowheader" id="casefilesheader">
            
            <div class="closebutton small" id="casefilesclose"></div>
            <p class="headertext">Case Files</p>
           
            <div style="width: 16px; height: 16px;"></div>
        </div>

        <div class="app-body">
            
            <div id="sidebar" class="sidebar"></div>

           
            <div id="noteContent" class="note-content"></div>
        </div>
    </div>

    
    <div id="top"
        style="position: absolute; border-radius: 30px; align-items: center; top: 0; left: 0; 
        box-sizing: border-box; width: 100%; display: flex; backdrop-filter: blur(10px); background-color: rgba(20, 20, 20, 0.8); color: #fff; justify-content: space-between; z-index: 999;">
        <p style="margin-left: 50px; font-family: impact; letter-spacing: 0.5px; font-size: 20px;">Bat OS</p>
        <a style="text-align: center; text-decoration: none; font-family: Helvetica; margin-left: 10px; 
        background-color: #ffcc00; padding: 8px 16px; border-radius: 16px; color: rgb(0, 0, 0);"
            href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">Click here
            for a surprise!</a>
        <p id="timetext" style="margin-right: 50px; font-family: Helvetica">16/08/2026 8:51 PM</p>
    </div>

    
    <div id="desktopApp" style="padding-top: 64px; padding-left:16px;">

        
        <div onclick="handleIconTap(this)" data-window="casefiles"
            style="text-align: center; padding: 16px; filter: drop-shadow(0 0 4px black); width: fit-content;">
            <img src="/icon.png" style="width: 64px; height: 64px; border-radius: 16px;">
            <p style=" font-family: Helvetica; font-weight: bold; margin: 3px; color: #f7f7f7;">Case Files</p>
        </div>
        <div onclick="handleIconTap(this)" data-window="jarv"
            style="text-align: center; padding: 16px; filter: drop-shadow(0 0 4px black); width: fit-content;">
            <img src="/jarv.png" style="width: 64px; height: 64px; border-radius: 16px;">
            <p style=" font-family: Helvetica; font-weight: bold; margin: 3px; color: #f7f7f7;">3D Jarv</p>
        </div>

  
    </div>
  

    <div class="window" id="jarv" style="display: none;">

        <div class="windowheader" id="jarvheader">
            <div class="closebutton small" id="jarvclose"></div>
            <p class="headertext">3D Jarv</p>
            <div style="width: 16px; height: 16px;"></div>
        </div>

        <div class="jarv-body">
            <p class="jarv-caption">Move your hand to move the sphere</p>

            <iframe
                src="https://3djarv.netlify.app/"
                title="3D Jarv"
                class="jarv-frame"
                loading="lazy"
                allow="camera"
            ></iframe>

            
            <a href="https://3djarv.netlify.app/" target="_blank" rel="noopener" class="jarv-openlink">
                Open in new tab ↗
            </a>
        </div>
    </div>
    

  
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="script.js"></script>
    <script>
        function updateTime() {
            var theTime = new Date().toLocaleString();
            var timeText = document.querySelector("#timetext");
            timeText.innerHTML = theTime;
        }
        setInterval(updateTime, 1000);
    </script>
</body>

</html>
