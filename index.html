<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS</title>
</head>

<body
    style="background-image: url('/oss.jpg'); margin:0; background-size: cover; background-repeat: no-repeat; background-attachment: fixed;">
    <div id="window" style=" position: absolute; background-color: rgba(128, 128, 128, 0.311); border: 2px solid black; top: 50%; left: 50%;

transform: translate(-50%, -50%); width: fit-content; border-radius: 5px;">
        <div id="welcomeopen"
            style="width: 16px; height: 16px; position: absolute; top: 20px; right: 10px; cursor: pointer; background-color: #7a0000; border-radius: 16px; border: solid 1px rgba(0, 0, 0, 0.25); margin-left: 6px;">
        </div>

        <img src="/batman-icon-png-12040.png" id="welcomeclose"
            style=" cursor: pointer; width: 100px; height: 100px; margin-top: -10px; margin-bottom: -5px; object-fit: cover;" />
        <h1 style="font-family:impact; margin: 4px; margin-top: -20px;">BatOS</h1>
        <p id="welcometext" style="margin: 4px;font-family: Helvetica;">This is <i>Batman</i> OS for the fans of Batman!
        </p>

    </div>
    <div
        style="position: absolute; border-radius: 30px; align-items: center; top: 0; left: 0; 
        box-sizing: border-box; width: 100%; display: flex; backdrop-filter: blur(10px); background-color: rgba(20, 20, 20, 0.8); color: #fff; justify-content: space-between;">
        <p style="margin-left: 50px; font-family: impact; letter-spacing: 0.5px; font-size: 20px;">BAT OS</p>
        <a style="text-align: center; text-decoration: none; font-family: Helvetica; margin-left: 10px; 
        background-color: #ffcc00; padding: 8px 16px; border-radius: 16px; color: rgb(0, 0, 0);"
            href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">Click here
            for a surprise!</a>
        <p id="timetext" style="margin-right: 50px; font-family: Helvetica">16/08/2026 8:51 PM</p>
    </div>
    <script src="script.js"></script>
    <script>
        function updateTime() {
            var theTime = new Date().toLocaleString();
            var timeText = document.querySelector("#timetext");
            timeText.innerHTML = theTime;
        }
        setInterval(updateTime, 1000);
    </script>
</body>

</html>
